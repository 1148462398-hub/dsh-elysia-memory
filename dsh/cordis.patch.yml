# 爱莉希雅的记忆插件（dsh-elysia）
#
# 说明：本 patch 随 bundle 一起被 loader 加载。
# - primaryPath：主记忆文件（默认在 DSH 主目录下，属于"插件存储空间"）
# - mirrorPath ：第二块硬盘分区上的镜像副本，每次写入同时更新
# 两个路径必须位于**不同硬盘分区**，否则镜像备份没有意义（插件会告警）。
# 留空 primaryPath / mirrorPath 时插件会自动选择：主盘 = %DSH_HOME%\dsh-shared-memory，
# 镜像 = 第一块非系统盘（本机为 D:）。

- insert:
    - id: elysia-memory
      name: 'dsh-elysia-memory'
      config:
        # 主/镜像路径留空 = 用默认值（主盘 %DSH_HOME%\dsh-shared-memory\MEMORY.md，
        # 镜像 = 第一块非系统盘）。发布到市场时**不要在这里写死绝对路径**，
        # 否则别人装上去会往你的目录里写。本机如需自定义，用面板「存储位置」迁移，
        # 路径会持久化到 state.json，不会被插件更新覆盖。
        # primaryPath: 'C:\Users\你\.dsh\dsh-shared-memory\MEMORY.md'
        # mirrorPath: 'D:\dsh-shared-memory\MEMORY.md'
        # 注入到系统提示词里的记忆上限（字符），超出部分按权重挑选
        injectChars: 6000
        # 每个分类最多保留多少条（超出部分按命中频率转入可检索归档）
        entryCap: 200
        profile: 'standard'
        # 是否自动把每轮用户输入的一句话摘要记入"用户请求流水"
        recordUserTurns: true
        # 是否记录子代理（subagent）会话，默认关闭以免污染
        recordSubagents: false
        # 语音朗读（可选，默认关闭）
        # 它依赖本机装好 GPT-SoVITS 引擎且在 9880 端口跑着；换一台机器就没有，
        # 所以插件本身要能干净地跑，语音是加装的皮肤。用户可在记忆网页上开关，
        # 也可以用 memory_file_voice({action:"enable"}) 在对话里开。
        voice:
          enabled: false
          # 气泡（头像 + 文字 + 表情包那一条「微信消息」）——**和引擎无关**，默认开。
          # 换一台没装引擎的电脑，她照样发消息，只是不出声。
          # 想连气泡都安静下来，改成 false。
          bubble: true
          engineUrl: 'http://127.0.0.1:9880'
          # 推理设备：auto（有 N 卡就用，没有就 CPU）/ cuda / cpu。
          # A 卡和纯 CPU 机器选 auto 或 cpu 即可（实测 CPU 约 1.15× 实时，能聊，就是慢）。
          device: 'auto'
          # 下面两条留空则用 elysia_say.py 的默认值；换机器后按实际路径填
          # pythonPath: 'C:\path\to\python.exe'
          # scriptPath: 'C:\path\to\elysia_say.py'
          model: 'v5turbo'
          ref: 'R06'
          speed: 1.0
          # 音量增益（dB）。0 = 不调；+6 约两倍响。只改波形幅度，不动系统音量。
          # 系统默认设备被切到别的声卡 / 虚拟设备时，靠这个能救回来一点。
          volume: 0
          minChars: 4
          # 合成音频缓存自动清理：保留最近 N 天 / 最多 N 个 wav。
          # 引擎自己不清，一个 wav 几百 KB，长年累月能吃掉好几个 GB。
          # 启动后 20 秒跑一次，之后每 6 小时一次；0 / -1 表示关掉对应规则。
          audioKeepDays: 7
          audioMaxFiles: 400
          # 总字节上限（默认 300 MB）。只按条数限不住磁盘：400 个文件实测 371 MB。
          audioMaxBytes: 314572800
          maxChars: 1200
          cooldownMs: 800
        # ═══ 主动助手（三组，全部默认关闭）═══════════════════════════
        #
        # 设计稿：docs/proactive-assistant.md
        # 铁律：默认关 / 只读 / 观测数据不进 MEMORY.md。

        # 1) 长期观测库（npm 的 node:sqlite，本地 SQLite，不需要装依赖）
        # 存「发生过什么」，不进提示词；靠 memory_file_timeline 按时间窗查。
        observations:
          enabled: false
          # 原始指标（cpu/mem/disk）保留多少小时；事件类默认保留 90 天
          rawKeepHours: 48
          eventKeepHours: 2160

        # 2) 自我感知（只采廉价指标：os.cpus / os.freemem，全部 < 1ms）
        # 触发的是「事件」，不是每 5 秒一条流水；有冷却，不刷屏。
        senses:
          enabled: false
          intervalSec: 10
          thresholds:
            cpu: 90
            cpuHoldSec: 120
            mem: 92
            diskFreeGB: 5
            diskPath: 'C:'

        # 3) B 站只读采集（绝不登录、绝不发帖）
        # 只产出「待审草稿」，由用户在 memory_file_review 里过目，
        # 最后一步发布永远是用户手动完成。
        bilibili:
          enabled: false
          # 一次抓多少热门视频 / 每条视频看多少评论
          popularLimit: 20
          commentLimit: 20
          # 每轮最多产多少条待审草稿
          maxCandidates: 3
